services:
  - type: web
    name: pikngo-user-service
    env: maven
    rootDir: user-service
    buildCommand: ./mvnw clean install -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      - key: DB_URL
        sync: false # Set this in Render Dashboard (e.g., jdbc:postgresql://db.xxxx.supabase.co:5432/postgres)
      - key: DB_USERNAME
        sync: false # Set this in Render Dashboard (e.g., postgres)
      - key: DB_PASSWORD
        sync: false # Set this in Render Dashboard
      - key: MAIL_USERNAME
        value: welcomedevil006@gmail.com
      - key: MAIL_PASSWORD
        sync: false # Set this manually in Render dashboard

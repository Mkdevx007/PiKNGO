# Database Configuration
spring.application.name=user-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pikngo_user_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
 
# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=INFO

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
 
# Validation
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
 
# Server Configuration
server.port=${PORT:8080}
 
# Logging
logging.level.org.springframework.web=INFO
logging.level.com.pikngo=DEBUG
 
# External Integrations (Developer 2)
# Razorpay Configuration
razorpay.key.id=rzp_test_placeholder
razorpay.key.secret=rzp_test_secret_placeholder

# Firebase Configuration
firebase.config.path=src/main/resources/service-account.json

# Email Configuration (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.debug=true

# Enhanced SMTP Reliability and Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
 
# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}

# Google OAuth Configuration
google.client.id=${GOOGLE_CLIENT_ID:your-google-client-id}

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Enhanced Debugging
logging.level.org.springframework.web.multipart=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ServletInvocableHandlerMethod=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Performance Optimization
spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=deferred

# HikariCP Tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
